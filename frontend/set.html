<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Question Set — Question Set Studio</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="with-sidebar">
  <aside id="sidebar" class="sidebar no-print"></aside>

  <main>
    <header class="page-header">
      <div class="page-header-inner" style="max-width: 50rem">
        <div>
          <div class="page-eyebrow"><a href="/generate.html">Question sets</a> / <span id="crumb-view">Paper</span></div>
          <h1 class="page-title" id="set-title">Loading…</h1>
          <p class="page-subtitle" id="set-meta"></p>
        </div>
        <div class="flex gap-2">
          <a class="btn btn-secondary" id="toggle-key" href="#">Answer key</a>
          <button class="btn btn-primary" onclick="window.print()">Print</button>
        </div>
      </div>
    </header>

    <div class="page-body" style="max-width: 54rem">
      <div id="notice" class="mb-4 no-print"></div>
      <div class="paper-sheet" id="content">Loading…</div>
    </div>
  </main>

  <script src="/js/layout.js"></script>
  <script src="/js/api.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const setId = params.get("id");
    const showKey = params.get("key") === "1";
    const content = document.getElementById("content");
    const notice = document.getElementById("notice");

    const toggle = document.getElementById("toggle-key");
    toggle.href = showKey ? `/set.html?id=${setId}` : `/set.html?id=${setId}&key=1`;
    toggle.textContent = showKey ? "Student paper" : "Answer key";
    document.getElementById("crumb-view").textContent = showKey ? "Answer key" : "Student paper";

    if (!setId) {
      content.innerHTML = '<p class="text-red-600">No question set id given.</p>';
    } else {
      const url = showKey ? `/api/question-sets/${setId}/answer-key` : `/api/question-sets/${setId}`;
      Api.get(url)
        .then(render)
        .catch((e) => (content.innerHTML = `<p class="text-red-600">Failed to load: ${escapeHtml(e.message)}</p>`));
    }

    function groupBySection(questions) {
      const groups = {};
      const order = [];
      for (const q of questions) {
        if (!(q.section in groups)) {
          groups[q.section] = [];
          order.push(q.section);
        }
        groups[q.section].push(q);
      }
      return order.map((name) => ({ name, questions: groups[name] }));
    }

    // Past-paper crops leave out the original blank working space, so add some back,
    // roughly in proportion to the marks.
    function workingSpaceCm(marks) {
      return Math.min(Math.max(1.5 * marks, 2), 10);
    }

    function imageQuestionHtml(q, number) {
      let html = `<div class="question-block mb-6">
        <div class="flex items-start gap-3">
          <span class="font-bold">${number}</span>
          <img class="question-img" src="${q.image_url}" alt="Question ${number}" />
        </div>`;
      if (showKey) {
        html += `<div class="mt-2 text-sm callout">
          <div class="text-xs text-gray-600 mb-1">Source: ${escapeHtml(q.source_label)}</div>
          ${q.answer_key_image_url
            ? `<img class="question-img" src="${q.answer_key_image_url}" alt="Mark scheme for question ${number}" />`
            : `<div><strong>Expected answer:</strong> ${escapeHtml(q.expected_answer) || "<em>no mark scheme uploaded</em>"}</div>`}
        </div>`;
      } else {
        html += `<div class="working-space" style="height: ${workingSpaceCm(q.marks)}cm"></div>`;
      }
      return html + "</div>";
    }

    function render(set) {
      document.title = `${set.name} — Question Set Studio`;
      const sections = groupBySection(set.questions);
      const total = set.questions.reduce((sum, q) => sum + q.marks, 0);
      document.getElementById("set-title").textContent = set.name;
      document.getElementById("set-meta").textContent = [
        set.subject,
        set.grade ? `Grade ${set.grade}` : "",
        `${set.questions.length} questions`,
        `${total} marks`,
        set.source === "bank" ? "Past-paper bank" : "AI-generated",
      ].filter(Boolean).join(" · ");

      const notices = [];
      if (showKey) {
        notices.push('<div class="callout callout-danger text-sm"><strong>Answer key.</strong> For the teacher or parent only. Do not print this for the student.</div>');
      }
      if (set.status === "ready" && set.error_message) {
        notices.push(`<div class="callout callout-warning text-sm">${escapeHtml(set.error_message)}</div>`);
      }
      notice.innerHTML = notices.join('<div class="mt-2"></div>');

      let html = `
        <div class="text-center mb-8">
          <h1>${escapeHtml(set.name)}</h1>
          <p class="text-sm text-gray-600 mt-1">${escapeHtml(set.subject)} ${set.grade ? "· Grade " + escapeHtml(set.grade) : ""}</p>
        </div>`;

      if (set.status !== "ready") {
        html += `<div class="callout callout-warning">This set is ${escapeHtml(set.status)}${set.error_message ? ": " + escapeHtml(set.error_message) : "."}</div>`;
        content.innerHTML = html;
        return;
      }
      if (set.source === "bank") {
        html += `<p class="text-sm text-center mb-6">Answer all questions. Total: ${total} marks.</p>`;
      }

      let number = 0;
      for (const section of sections) {
        if (section.name) {
          html += `<h2 class="font-bold text-lg mt-8 mb-3 border-b pb-1">Section ${escapeHtml(section.name)}</h2>`;
        }
        section.questions.forEach((q, i) => {
          if (q.image_url) {
            html += imageQuestionHtml(q, ++number);
            return;
          }
          html += `<div class="mb-5">
            <p><span class="font-semibold">${i + 1}.</span> ${escapeHtml(q.text).replace(/\n/g, "<br>")}
              <span class="text-xs text-gray-500">[${q.marks} mark${q.marks == 1 ? "" : "s"}]</span></p>`;
          if (q.options && q.options.length) {
            html += `<ul class="ml-6 mt-1 list-[lower-alpha] text-sm">${q.options.map((o) => `<li>${escapeHtml(o)}</li>`).join("")}</ul>`;
          }
          if (!q.options) {
            html += `<div class="border-b border-dashed border-gray-300 h-10 mt-2"></div>`;
          }
          if (showKey) {
            html += `<div class="mt-2 text-sm callout">
              <div><strong>Expected answer:</strong> ${escapeHtml(q.expected_answer)}</div>
              <div><strong>Rubric:</strong> ${escapeHtml(q.rubric)}</div>
            </div>`;
          }
          html += `</div>`;
        });
      }
      content.innerHTML = html;
    }
  </script>
</body>
</html>
